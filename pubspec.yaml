name: app_lern_deutsch_mobile
description: "Hoppla! - Une erreur ? Hoppla ! Tu l'apprends pour de bon. Apprentissage accéléré de l'allemand parlé par répétition espacée."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & Navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Base de données locale & Préférences
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.3

  # Cloud Backend & Authentification
  supabase_flutter: ^2.8.0
  flutter_web_plugins:
    sdk: flutter

  # Audio & Voix
  flutter_tts: ^4.2.3
  record: ^5.2.1
  just_audio: ^0.9.46
  permission_handler: ^11.4.0

  # UI & Design
  google_fonts: ^6.3.2
  flutter_animate: ^4.5.2
  intl: ^0.20.2
  url_launcher: ^6.3.3
  file_picker: ^13.1.0
  lottie: ^3.6.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.5

dependency_overrides:
  record_platform_interface: 1.2.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/phrases.json
    - assets/images/
    - assets/animations/
    - assets/audio/male/
    - assets/audio/female/
    - assets/media/
    - assets/media/audio/
